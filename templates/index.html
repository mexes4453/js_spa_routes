<!DOCTYPE html>
<html>
    <head>
        <title>JS SPA Routes</title>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" />

    </head>
    <body>
        <div class="container">
            <div id="main">
                <nav class = "nav">
                     <a href="/" data-link>Home</a>
                     <a href="/about" data-link>About Us</a>
                     <a href="/contact" data-link>Contact Us</a>
                     <a href="/post" data-link>Post</a>
                </nav>
                <div id="app"></div>
              </div> 
        </div> 

        <!-- It is recommended to always but the script just the closing tag
             of the body element.
            This ensures that the page contects looads first before the loading
            the script items wihich may take some some extra time.
        -->
        <!-- attribute "type" allows the use of es6 module import export -->
        <script type="module" src="/static/js/index.js"></script>
        
    </body>
</html>
